name: Security review pilot

# Billable calls remain manual; push/PR only run the separate offline checks.
on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model for this pilot
        required: true
        type: choice
        default: gpt-6.1-sol
        options:
          - gpt-6.1-sol
          - gpt-6-astra
      max_cost_usd:
        description: Maximum estimated API spend for this run (0 < amount <= 1.00 USD)
        required: true
        type: string
        default: "1.00"

permissions:
  contents: read

concurrency:
  group: security-review-pilot
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the repository's default branch."
            exit 1
          fi

      - name: Check out the dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Test this exact revision before exposing the API secret to any step.
      - name: Run offline safety and accounting tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify the API secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Add the OPENAI_API_KEY repository Actions secret before running the pilot."
            exit 1
          fi

      - name: Fetch pinned public source samples
        timeout-minutes: 2
        run: python3 scripts/fetch_cases.py --manifest benchmarks/pilot.json

      # The CLI validates the model, budget and complete source selection before
      # any API request. Up to 6 requests (3 counts + 3 generations), no retries.
      - name: Review the pilot samples
        id: review
        timeout-minutes: 15
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BENCHMARK_MODEL: ${{ inputs.model }}
          BENCHMARK_BUDGET: ${{ inputs.max_cost_usd }}
        run: |
          python3 -m security_review run \
            --manifest benchmarks/pilot.json \
            --output-dir reports/pilot \
            --model "$BENCHMARK_MODEL" \
            --max-cost-usd "$BENCHMARK_BUDGET" \
            --max-calls 3

      - name: Publish only public cost and coverage metrics
        if: always()
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome || 'skipped' }}
        run: |
          if [[ -f src/security_review/public_metrics.py ]]; then
            python3 -m security_review.public_metrics reports/pilot/summary.json \
              --step-outcome "$REVIEW_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '# Security review metrics' '' 'Status: **incomplete**' '' \
              'Usage and cost are unknown; no security conclusion can be drawn.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
