name: Security review pilot

# Manual only. Default mode tests recovery without any API key or API call.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Test local recovery first, then select review for paid inference
        required: true
        type: choice
        default: recovery-check
        options:
          - recovery-check
          - review
      recovery_confirmed:
        description: I decrypted a recovery-check artifact locally with the current key
        required: true
        type: boolean
        default: false
      model:
        description: OpenAI model (review mode only)
        required: true
        type: choice
        default: gpt-6.1-sol
        options:
          - gpt-6.1-sol
          - gpt-6-astra
      max_cost_usd:
        description: Estimated API budget per review invocation (0 < amount <= 1.00 USD)
        required: true
        type: string
        default: "1.00"

permissions:
  contents: read

concurrency:
  group: security-review-pilot
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
      REQUIRE_AGE: "1"
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the repository's default branch."
            exit 1
          fi

      - name: Check out the dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install age from signed Ubuntu package repositories
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
          age --version

      - name: Run offline safety and accounting tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate encryption before any API use
        id: encryption
        env:
          REVIEW_AGE_RECIPIENT: ${{ secrets.REVIEW_AGE_RECIPIENT }}
        run: python3 -m security_review.recovery preflight

      - name: Confirm local recovery before paid inference
        if: inputs.mode == 'review'
        env:
          CONFIRMED: ${{ inputs.recovery_confirmed }}
        run: |
          if [[ "$CONFIRMED" != "true" ]]; then
            echo "::error::First decrypt a recovery-check artifact using the current local identity."
            exit 1
          fi

      - name: Create an API-free recovery probe
        id: probe
        if: inputs.mode == 'recovery-check'
        env:
          REVIEW_AGE_RECIPIENT: ${{ secrets.REVIEW_AGE_RECIPIENT }}
        run: |
          python3 -m security_review.recovery seal --probe --outcome success \
            --output-dir "$RUNNER_TEMP/security-review-encrypted"

      - name: Verify the API secret is configured
        if: inputs.mode == 'review'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Add the OPENAI_API_KEY repository Actions secret."
            exit 1
          fi

      - name: Fetch pinned public source samples
        if: inputs.mode == 'review'
        timeout-minutes: 2
        run: python3 scripts/fetch_cases.py --manifest benchmarks/pilot.json

      - name: Review the pilot samples
        if: inputs.mode == 'review'
        id: review
        timeout-minutes: 15
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BENCHMARK_MODEL: ${{ inputs.model }}
          BENCHMARK_BUDGET: ${{ inputs.max_cost_usd }}
        run: |
          python3 -m security_review run \
            --manifest benchmarks/pilot.json \
            --output-dir "$RUNNER_TEMP/security-review-plaintext" \
            --model "$BENCHMARK_MODEL" \
            --max-cost-usd "$BENCHMARK_BUDGET" \
            --max-calls 3

      # Recover the latest atomic checkpoint even after an inference failure.
      # A killed/lost runner can still prevent this step: delivery is not guaranteed.
      - name: Seal the latest report checkpoint
        id: seal
        if: always() && inputs.mode == 'review' && steps.encryption.outcome == 'success' && steps.review.outcome != 'skipped'
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome || 'unknown' }}
          REVIEW_AGE_RECIPIENT: ${{ secrets.REVIEW_AGE_RECIPIENT }}
        run: |
          python3 -m security_review.recovery seal \
            --report-dir "$RUNNER_TEMP/security-review-plaintext" \
            --output-dir "$RUNNER_TEMP/security-review-encrypted" \
            --outcome "$REVIEW_OUTCOME"

      - name: Upload only the encrypted report
        id: upload
        # A failed review can still deliver a complete encrypted checkpoint.
        if: always() && (steps.probe.outcome == 'success' || steps.seal.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encrypted-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-review-encrypted/report.json.age
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
          overwrite: false

      - name: Publish only public cost and coverage metrics
        if: always()
        env:
          REVIEW_MODE: ${{ inputs.mode }}
          REVIEW_OUTCOME: ${{ steps.review.outcome || 'skipped' }}
          DELIVERY_OUTCOME: ${{ steps.upload.outcome || 'skipped' }}
        run: |
          if [[ "$REVIEW_MODE" == "review" && -f src/security_review/public_metrics.py ]]; then
            python3 -m security_review.public_metrics "$RUNNER_TEMP/security-review-plaintext/summary.json" \
              --step-outcome "$REVIEW_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '# Recovery check' '' 'No OpenAI API call is made in recovery-check mode.' >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$DELIVERY_OUTCOME" in
            success) printf '\nEncrypted artifact uploaded; local decryption is still required.\n' >> "$GITHUB_STEP_SUMMARY" ;;
            *) printf '\nEncrypted delivery unavailable. No plaintext fallback.\n' >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Remove local plaintext and downloaded sources
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/security-review-plaintext" "$GITHUB_WORKSPACE/.work/sources"
