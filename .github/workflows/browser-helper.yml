name: Offline browser helper

on:
  push:
    branches: [main, feat/offline-browser-helper]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test-only tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Build one offline HTML from the pinned upstream bundle
        run: python3 scripts/build_browser_helper.py
      - name: Test browser setup and native-age report recovery
        run: python3 tests/browser_helper_smoke.py
      - name: Upload the helper, never keys or reports
        # Only publish a helper built from the reviewed default branch.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-browser-helper
          path: |
            dist/security-review.html
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
