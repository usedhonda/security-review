name: Report viewer website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build*'
      - 'tests/browser*'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/build*'
      - 'tests/browser*'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-viewer-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test-only tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends age
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Build the public viewer, never reports or keys
        run: python3 scripts/build_pages.py
      - name: Verify offline compatibility
        run: python3 tests/browser_helper_smoke.py
      - name: Verify HTTPS viewer and local-only decryption
        run: python3 tests/browser_pages_smoke.py
      - name: Verify publish file allowlist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('_pages')
          assert {p.name for p in root.iterdir()} == {'index.html', 'robots.txt', '.nojekyll'}
          assert all(p.is_file() and not p.is_symlink() for p in root.iterdir())
          assert (root / 'index.html').stat().st_size < 300_000
          PY
      - name: Upload only the tested static website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _pages
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # First-time enablement: Settings > Pages > Source > GitHub Actions.
      # No PAT, API key or report decryption key is supplied to this job.
      - name: Publish the viewer
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
