name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep hosted-runner usage within the free public-repository configuration.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the proposed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the Python runtime
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ is required"'

      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v
