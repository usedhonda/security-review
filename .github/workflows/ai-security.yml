name: AI security review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  security-events: write

jobs:
  ai-review:
    uses: usedhonda/security-review/.github/workflows/ai-review-reusable.yml@b8fa99fd526f9d37cdb8f4d29a671a826abf7a8e
    with:
      max_cost_usd: '0.50'
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
